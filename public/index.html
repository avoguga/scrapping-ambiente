<!-- public/index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Scraping de Notícias sobre Meio Ambiente</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos mantidos e ajustados */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #212529;
        }
        .container {
            max-width: 90%;
            margin: 40px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #343a40;
            margin-bottom: 30px;
        }
        .button-container {
            text-align: center;
            margin-bottom: 20px;
        }
        #numMoreResults {
            width: 150px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ced4da;
            border-radius: 50px;
            text-align: center;
        }
        #extractMoreButton {
            background-color: #007bff;
            color: #fff;
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-left: 10px;
        }
        #extractMoreButton:hover {
            background-color: #0056b3;
        }
        #downloadButton {
            background-color: #28a745;
            color: #fff;
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-left: 10px;
        }
        #downloadButton:hover {
            background-color: #218838;
        }
        #messages {
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            border-radius: 5px;
            font-size: 14px;
        }
        .message {
            margin-bottom: 10px;
            font-family: monospace;
            color: #495057;
        }
        #resultContainer {
            margin-top: 30px;
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
            color: #212529;
        }
        th, td {
            padding: 12px 15px;
            border: 1px solid #dee2e6;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        tr:nth-child(even) {
            background-color: #f1f3f5;
        }
        tr:hover {
            background-color: #e9ecef;
        }
        /* Responsividade */
        @media (max-width: 768px) {
            th, td {
                font-size: 12px;
                padding: 8px;
            }
            #extractMoreButton, #downloadButton {
                padding: 10px 20px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Scraping de Notícias sobre Meio Ambiente</h1>
        <div class="button-container">
            <input type="number" id="numMoreResults" min="1" value="5" placeholder="Qtd. a Extrair" title="Digite a quantidade de resultados a extrair">
            <button id="extractMoreButton">Extrair Mais</button>
            <button id="downloadButton">Baixar Excel</button>
        </div>
        <div id="messages"></div>
        <div id="resultContainer">
            <div style="overflow-x: auto;">
                <table id="resultTable">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Categoria</th>
                            <th>Título</th>
                            <th>Descrição</th>
                            <th>Autor</th>
                            <th>Link</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let scrapedData = [];

        // Iniciar o scraping inicial ao carregar a página
        window.onload = () => {
            fetch('/start-scraping', { method: 'POST' });

            const eventSource = new EventSource('/events');
            const messagesDiv = document.getElementById('messages');

            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);

                if (data.message) {
                    const messageElement = document.createElement('div');
                    messageElement.className = 'message';
                    messageElement.textContent = data.message;
                    messagesDiv.appendChild(messageElement);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }

                if (data.data) {
                    scrapedData = data.data;
                    displayResults(scrapedData);
                }
            };

            eventSource.onerror = function(err) {
                console.error("EventSource failed:", err);
                eventSource.close();
            };
        };

        document.getElementById('extractMoreButton').addEventListener('click', () => {
            const numMoreResultsInput = document.getElementById('numMoreResults');
            let numMoreResults = parseInt(numMoreResultsInput.value);

            if (isNaN(numMoreResults) || numMoreResults <= 0) {
                numMoreResults = 5;
            }

            fetch('/extract-more', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ numMoreResults })
            });
        });

        document.getElementById('downloadButton').addEventListener('click', downloadExcel);

        function displayResults(data) {
            const resultContainer = document.getElementById('resultContainer');
            const tbody = document.querySelector('#resultTable tbody');
            tbody.innerHTML = '';

            data.forEach(noticia => {
                const row = document.createElement('tr');

                const dataCell = document.createElement('td');
                dataCell.textContent = noticia.data;
                row.appendChild(dataCell);

                const categoriaCell = document.createElement('td');
                categoriaCell.textContent = noticia.categoria;
                row.appendChild(categoriaCell);

                const tituloCell = document.createElement('td');
                tituloCell.textContent = noticia.titulo;
                row.appendChild(tituloCell);

                const descricaoCell = document.createElement('td');
                descricaoCell.textContent = noticia.descricao;
                row.appendChild(descricaoCell);

                const autorCell = document.createElement('td');
                autorCell.textContent = noticia.autor;
                row.appendChild(autorCell);

                const linkCell = document.createElement('td');
                const link = document.createElement('a');
                link.href = noticia.link;
                link.textContent = 'Ver Notícia';
                link.target = '_blank';
                link.style.color = '#007bff';
                link.style.textDecoration = 'none';
                link.addEventListener('mouseover', () => {
                    link.style.textDecoration = 'underline';
                });
                link.addEventListener('mouseout', () => {
                    link.style.textDecoration = 'none';
                });
                linkCell.appendChild(link);
                row.appendChild(linkCell);

                tbody.appendChild(row);
            });

            resultContainer.style.display = 'block';
        }

        function downloadExcel() {
            window.location.href = `/download-excel`;
        }
    </script>
</body>
</html>
